name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64, dind]
    env:
      IDF_IMAGE: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The build runs in the ESP-IDF image, but the *job* does not: a step
      # running inside `container:` never receives ACTIONS_RESULTS_URL, and
      # without it upload-artifact cannot reach the artifact backend — which is
      # what failed every run of this workflow from b1598e7 onwards. Driving
      # docker ourselves, the way release.yml already does on this runner,
      # keeps the toolchain in the image and leaves the artifact upload on the
      # runner where its environment is intact.
      - name: Build firmware in the ESP-IDF container
        run: |
          set -eux
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e HOME=/tmp \
            "$IDF_IMAGE" bash -lc 'idf.py build'

      - name: Collect artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wildfire_monitor-firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
          if-no-files-found: error
